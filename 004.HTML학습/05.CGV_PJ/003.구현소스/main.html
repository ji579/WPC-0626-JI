<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CGV에 오신것을 환영합니다!</title>
    <!-- 폰트어썸 아이콘 CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />

    <!-- 메인 CSS -->
    <link rel="stylesheet" href="./css/main.css" />
    <!-- 미디어쿼리 CSS : 
     덮어쓸 수 있게 메인 CSS 아래쪽에 위치해야함! -->
    <link rel="stylesheet" href="./css/media.css" />
    

    <!-- 추가 기능 JS 외부파일
     defer속성은 html태그 로딩후 실행함! -->
     <script src="./js/main.js" defer></script>
  </head>
  <body>
    <!-- 1. 상단영역 -->
    <div id="top-area">
      <header class="top-area inbox"></header>
    </div>
    <!-- 2. 메인영역 -->
    <div id="main-area">
      <main class="main-area inbox">
        <!-- 2-1. 스크린박스 -->
         <div class="screen">
          <!-- 유튜브 아이프레임 -->
           <iframe src="https://www.youtube.com/embed/8p1VNDiI4WM?autoplay=1&mute=1&loop=1&playlist=8p1VNDiI4WM" allow="autoplay"></iframe>
         </div>
         <!-- 2-2. 메뉴 박스 -->
          <nav class="poster-menu-box">
            <ul>
              <li>
                <a href="#">
                  <img src="./images/m1.jpg" alt="영화명">
                  <!-- 영화개요박스 -->
                   <hgroup class="movie-info">
                    <h2>아마존 활명수</h2>
                    <h3>류승룡, 진선규</h3>
                    <h4>코미디</h4>
                   </hgroup>
                </a>
              </li>
              <li>
                <a href="#">
                  <img src="./images/m2.jpg" alt="영화명">
                  <!-- 영화개요박스 -->
                   <hgroup class="movie-info">
                    <h2>베놈: 라스트 댄스</h2>
                    <h3>톰 하디</h3>
                    <h4>액션, SF, 스릴러</h4>
                   </hgroup>
                </a>
              </li>
              <li>
                <a href="#">
                  <img src="./images/m3.jpg" alt="영화명">
                  <!-- 영화개요박스 -->
                   <hgroup class="movie-info">
                    <h2>데드라인</h2>
                    <h3>공승연, 박지일</h3>
                    <h4>드라마</h4>
                   </hgroup>
                </a>
              </li>
              <li>
                <a href="#">
                  <img src="./images/m4.jpg" alt="영화명">
                  <!-- 영화개요박스 -->
                   <hgroup class="movie-info">
                    <h2>글래디에이터 2</h2>
                    <h3>폴 메스칼</h3>
                    <h4>액션, 사극</h4>
                   </hgroup>
                </a>
              </li>
              <li>
                <a href="#">
                  <img src="./images/m5.jpg" alt="영화명">
                  <!-- 영화개요박스 -->
                   <hgroup class="movie-info">
                    <h2>청설</h2>
                    <h3>홍경, 노윤서</h3>
                    <h4>드라마, 멜로</h4>
                   </hgroup>
                </a>
              </li>
              <li>
                <a href="#">
                  <img src="./images/m6.jpg" alt="영화명">
                  <!-- 영화개요박스 -->
                   <hgroup class="movie-info">
                    <h2>4분 44초</h2>
                    <h3>유지애, 함연지</h3>
                    <h4>공포,스릴러</h4>
                   </hgroup>
                </a>
              </li>
            </ul>
          </nav>
      </main>
    </div>
    
    <!-- 3. 하단영역 -->
    <div id="bottom-area">
      <footer class="bottom-area inbox"></footer>
    </div>
    
  </body>
</html>
