<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>나의 트랜스폼 작품</title>
    <!--  트랜스폼 샘플 사이트 
      https://tombap8.github.io/FED-RV-TOM-2024/002.HTML%ED%95%99%EC%8A%B5/05.Transform_PJ/index.html-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Sunflower:wght@300&display=swap');
</style>
    <style>
      /* 전체 배경넣기 */
      body {
        /* background: 색이반고윙/크; */
        /* background: 색 이미지 반복 고정 위치/크기; */
        /* background: url(./images/bg-main.jpg) no-repeat fixed center top/cover; */



        /* 폰트 */
        font-family: "Sunflower", sans-serif;
        font-weight: 300;
        font-style: normal;
        font-size: 20px;

        /* 1. 이미지 */
        background-image: url(./images/chiback.jpg);

        /* 2. 반복여부 */
        background-repeat: no-repeat;

        /* 3. 고정 : 배경이미지 화면고정 */
        background-attachment: fixed;
        /* 4. 위치 : 가로(x축) 세로(y축) 
        가로값- left(기본값), right, center, 수치값
        세로값- top, bottom, center(기본값), 수치값*/
        background-position: center top;
        /* 5. 크기: 가로(width) 세로(height) 
      1) contain -> 배경이미지가 모두 보임 (비율 맞게)
      2) cover -> 비율에 맞게 대상박스의 빈공간이 없음!
      3) 모두 채운후 비율없이 만드는 방법 100% 100%
       */
        background-size: cover;
      }
      /* 1. 제목 */
      .main-title {
        /* 박스셋팅 */
        text-align: center;
        background-color: #00000048;
        border-radius: 50px;
        /* 글자 셋팅 */
        color: #fff;
        font-size: 50px;
        /* line-height = 줄간격 */
        line-height: 100px;
        /* 글자 테두리 */
        text-shadow: 4px 0 darkgreen, -4px 0 darkgreen, 0 4px darkgreen,
          0 -4px darkgreen;
        /* -webkit-text-stroke: 1px red; */
      }

      /* 전체 부모박스 */
      .main-contents {
        /* 부모자격주기 (span 타이틀의 부모) */
        
        /* 박스셋팅 */
        max-width: 1300px;
        /* 마영오 */
        margin: 200px auto;
        border: 10px solid rgb(250, 240, 240);
        border-radius: 20px;
        padding: 20px;

        /* 기본적으로 박스크기를 잡으면 그 크기는 컨텐트 영역의 크기임
        보더와 패딩은 바깥쪽으로 생김-> 그래서 박스가 커짐 
        보더,패딩을 크기셋팅에 포함시키려면 
        box-sizing:border-box 셋팅해야함!*/
        box-sizing: border-box;

      }
      /* 부모박스 가상요소 clear셋팅(float때문에 부모박스가 망가짐) */
      .main-contents::after {
        content: "";
        display: block;
        clear: both;
      }
      /* 캐릭터박스 공통 */
      .main-contents > div {
           /* 부모자격주기 (span타이틀의 부모) */
        position: relative;
        height: 300px;
        /* 옆으로 흐르게 */
        float: left;
        /* 3개씩 등분 */
        width: calc(100% / 3);
        /* 이미지 중앙정렬 tac */
        text-align: center;

        /* 아래쪽 마진 -> 안주고 마진탑주기
    margin-bottom: 50px; */
      }
 /* span 타이틀 */
      .main-contents > div span {
        position: absolute;
        bottom: 0;
        /* 위치값으로 크기주기! */
        left: 0;
        right: 0;        /* 글자셋팅 */
        text-align: center;
        font-weight: bold;
        color: #fff;
        -webkit-text-stroke: .2px #000;
        font-size: 24px;

        /* 처음에 투명 opa */
        opacity: 0;

        /* 트랜지션 trs */
        transition: 0.3s .6s;
      }
       .main-contents > div:hover span{
        opacity: 1;
      }

      /* 애니메이션 이동박스 : .ani-box */
      .ani-box{
        transition: 0.6s;

      }

    
      /* 5번째 div 이후 자식 마진탑주기 */
      .main-contents > div:nth-child(3) ~ div {
        /* 윗쪽마진 */
        margin-top: 20px;
      }

      /* 캐릭터이미지 셋팅 (비율박스) */
      .main-contents > div img {
        width: 300px;
        height: 300px;
        /* 원형 */
        border-radius: 50%;

        /* 트랜지션 trs ..> 박스한테 주면 에러 그래서 이미지에 효과주기*/
        transition: 0.6s;
      }
    

      /* 이미지가 겹치게 앱솔루트 셋팅 */
      #transform-box1 img {
        position: absolute;
        width: 300px;
        height: 300px;
      } 
      /* 1.첫번째 img자식 - 유정이 원본(돌아올때) */
      #transform-box1 img:nth-of-type(2){
        /* 처음에 90도로 숨겨짐 */
        transform: rotateY(90deg);
        /* 트랜지션 trs : 바로출발, 처음만 천천히 ease-in */
        transition: 0.4s ease-in;
      }
      /* 2.첫번째 img자식 - 유정이 오버시 */
       #transform-box1:hover img:nth-of-type(2) {
        /* 처음에 90도로 숨겨짐 */
        transform: rotateY(0deg);
        /* 트랜지션 trs : 
      보거미돌동안 0.4초 기다려 / 
      그대로 받아서 끝에 천천히 ease-out */
        transition: 0.4s ease-out 0.4s;}
          #transform-box1 img:nth-of-type(1) {
        /* 처음에 0도로 보임 */
        transform: rotateY(0deg);
        /* 트랜지션 trs : 
      돌아올때 유정이 0.4초 기다려 / 
      그대로 받아서 끝에 천천히 ease-out */
        transition: 0.4s ease-out 0.4s;
      }
      /* 4.마지막째 img자식 - 보거미 오버시 */
       #transform-box1:hover img:nth-of-type(1) {
        /* 오버시 90도로 숨겨짐 */
        transform: rotateY(90deg);
        /* 트랜지션 trs : 바로출발, 처음만 천천히 ease-in */
        transition: 0.4s ease-in;
      }

/* #transform-box1 img{
  position: absolute;
  width: 300px;
  height: 300px;
}

      #transform-box1 img:nth-of-type(2){
        opacity: 0;
        transition: .3s;
      }
      #transform-box1:hover img:nth-of-type(2){
        opacity: 1; */


        /**********************************************  
        CSS 필터 적용하기
      : 필터속성은 흑백,흐림,세피아,명암,
        채도 등 출력이미지를 변경하고자 할때
        사용하는 속성
        (참고)
        https://www.w3schools.com/cssref/playit.php?filename=playcss_filter&preval=blur(5px) */
      
  
      #transform-box2 img {
        /* 미리 x축 회전 해놓기 :tfrx */
        transform: rotateX(180deg);
        /* 필터블러 */
        filter: blur(2px);
      }
      /* 오버시 원상복귀 */
      #transform-box2:hover img {
        /* 미리 x축 회전 해놓기 :tfrx */
        transform: rotateX(0deg);
        /* 필터블러 */
        filter: blur(0px);
      }

      #transform-box3:hover img {
        /* x축이동 tftx */
        transform: translateX(-50%);
        /* -> % 단위 기준은 항상 자기자신의 크기다 */
      }

      #transform-box4:hover img {
        /* y축이동 tfty */
        transform: translateY(200%);
        /* -> %단위 기준은 항상 자기자신의 크기다!!! */
      }

    
      #transform-box5:hover img {
        /* x, y축이동 tft */
        /* transform: translate(-100%, -100%); */
        translate: 0 -100%;

        /* 투명도조정- opacity속성 */
        opacity: 0.5;
      }


      /* 이미지 회전축 변경하기 */
      #transform-box6 img {
        transform-origin: 20% 20%;
      }
      #transform-box6:hover img {
        /* 원형회전:tfr */
        /* transform: rotate(4587deg); */

        rotate: 4586deg;

  
        /* 트랜지션 시간늘리기 */
        transition-duration: 10s;
      }

/* 인트로 등장 애니메이션 설정하기 */
/* animate를 배우기 전이므로 :hover를 사용 */
 .main-contents{
  /* 오른쪽 바깥에 나가있게 셋팅함! translate사용 */
  /* translate:140% ; */
  /* 트랜지션trs */
  transition: .8s ease-out 1s;
 }
body:hover .main-contents{ 
  translate: 0 ;

}

    </style>
  </head>
  <body>
    <!-- 1. 제목 -->
    <h1 class="main-title">트랜스폼 연습</h1>
    <!-- 2. 컨텐츠 박스 -->
    <section class="main-contents">
      <div id="transform-box1">
        <div class="ani-box">
        <img src="images/chi1.jpg" alt="캐릭터" />
        <img src="images/chi11.jpg" alt="캐릭터" />
        <span>치이카와</span>
        </div>

      </div>
      <div id="transform-box2">
        <div class="ani-box">
          <img src="images/chi2.jpg" alt="캐릭터" />
          <span>하치와레</span>
        </div>
      </div>
      <div id="transform-box3">
        <div class="ani-box"><img src="images/chi3.jpg" alt="캐릭터" /><span>우사기</span></div>
      </div>
      <div id="transform-box4">
        <div class="ani-box"><img src="images/chi4.jpg" alt="캐릭터" /><span>쿠리만쥬</span></div>
      </div>
      <div id="transform-box5">
        <div class="ani-box"><img src="images/chi5.jpg" alt="캐릭터" /><span>시샤</span></div>
      </div>
      <div id="transform-box6">
        <div class="ani-box"><img src="images/chi6.jpg" alt="캐릭터" /><span>랏코</span></div>

    </section>
  </body>
</html>
