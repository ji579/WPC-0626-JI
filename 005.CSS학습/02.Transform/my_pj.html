<style>

    <style>
      /* 전체 배경넣기 */
      body {
        /* background: 색이반고윙/크; */
        /* background: 색 이미지 반복 고정 위치/크기; */
        /* background: url(./images/bg-main.jpg) no-repeat fixed center top/cover; */



        /* 폰트 */
        font-family: "Sunflower", sans-serif;
        font-weight: 300;
        font-style: normal;
        font-size: 20px;

        /* 1. 이미지 */
        background-image: url(./images/chiback.jpg);

        /* 2. 반복여부 */
        background-repeat: no-repeat;

        /* 3. 고정 : 배경이미지 화면고정 */
        background-attachment: fixed;
        /* 4. 위치 : 가로(x축) 세로(y축) 
        가로값- left(기본값), right, center, 수치값
        세로값- top, bottom, center(기본값), 수치값*/
        background-position: center top;
        /* 5. 크기: 가로(width) 세로(height) 
      1) contain -> 배경이미지가 모두 보임 (비율 맞게)
      2) cover -> 비율에 맞게 대상박스의 빈공간이 없음!
      3) 모두 채운후 비율없이 만드는 방법 100% 100%
       */
        background-size: cover;
      }
      /* 1. 제목 */
      .main-title {
        /* 박스셋팅 */
        text-align: center;
        background-color: #00000048;
        border-radius: 50px;
        /* 글자 셋팅 */
        color: #fff;
        font-size: 50px;
        /* line-height = 줄간격 */
        line-height: 100px;
        /* 글자 테두리 */
        text-shadow: 4px 0 darkgreen, -4px 0 darkgreen, 0 4px darkgreen,
          0 -4px darkgreen;
        /* -webkit-text-stroke: 1px red; */
      }

      .sub-title {
        /* 박스셋팅 */
        text-align: center;
        border-radius: 50px;
        /* 글자 셋팅 */
        color: #fff;
        font-size: 50px;
        /* line-height = 줄간격 */
        line-height: 100px;
        margin: 0 auto;

}
p::before {
  content: "";
  display: block;
/* 마(진) 영(위) 오(양쪽) 아래 */
  margin: 0 auto 15px;
  max-width: 1000px;
  height: 1px;
  background-color: #ccc;
}

 p{
  text-align: center;
  color: #fff;
  font-size: 25px;
  margin: 0 auto;
}
      /* 전체 부모박스 */
      .main-contents {
        /* 부모자격주기 (span 타이틀의 부모) */
        
        /* 박스셋팅 */
        max-width: 1300px;
        /* 마영오 */
        margin: 50px auto;
        border: 10px solid rgb(250, 240, 240);
        border-radius: 20px;
        padding: 20px;

        /* 기본적으로 박스크기를 잡으면 그 크기는 컨텐트 영역의 크기임
        보더와 패딩은 바깥쪽으로 생김-> 그래서 박스가 커짐 
        보더,패딩을 크기셋팅에 포함시키려면 
        box-sizing:border-box 셋팅해야함!*/
        box-sizing: border-box;

      }
      /* 부모박스 가상요소 clear셋팅(float때문에 부모박스가 망가짐) */
      .main-contents::after {
        content: "";
        display: block;
        clear: both;
      }


/*옆에 변하는 이미지 */
      a.my-cha-link {
        width: 116px;
        height: 100px;
  /* a요소는 위아래 마진 적용안되므로
  인라인블록으로 display 변경함! */
  display: inline-block;
 position:relative;
  left: 50%;
  translate: -50%;
 
  margin-top: 26px;
  /* 인라인요소간 진행방향 세로정렬
  -> 옆에 있는 깃허브로고가 영향을 받으므로
  이 정렬속성으로 세로위치를 조정함! */
  vertical-align: -22px;
    text-align: center;
  }
/* 처음에 마지막째 이미지는 안보이게함 */
.my-cha-link img:last-child{
  display: none;
}
/* 마우스 오버시 첫번째 이미지 안보이게함 */
.my-cha-link:hover img:first-child{
  display: none;
}
/* 마우스 오버시 마지막째 이미지 보이게함 */
.my-cha-link:hover img:last-child{
  display: inline;
}


      /* 캐릭터박스 공통 */
      .main-contents > div {
           /* 부모자격주기 (span타이틀의 부모) */
        position: relative;
        height: 300px;
        /* 옆으로 흐르게 */
        float: left;
        /* 3개씩 등분 */
        width: calc(100% / 3);}
       

.main-contents > div:nth-child(1) ~ div {
   /* 이미지 중앙정렬 tac */
        text-align: center;

        /* 아래쪽 마진 -> 안주고 마진탑주기
    margin-bottom: 50px; */
      }
 /* span 타이틀 */
      .main-contents > div span {
        position: absolute;
        bottom: 0;
        /* 위치값으로 크기주기! */
        left: 0;
        right: 0;        /* 글자셋팅 */
        text-align: center;
        font-weight: bold;
        color: #fff;
        -webkit-text-stroke: .2px #000;
        font-size: 24px;

        /* 처음에 투명 opa */
        opacity: 1;

        /* 트랜지션 trs */
        transition: 0.2s .3s;
      }
       .main-contents > div:hover span{
        opacity: 0;
      }

      /* 애니메이션 이동박스 : .ani-box */
      .ani-box{
        transition: 0.6s;

      }

    
      /* 5번째 div 이후 자식 마진탑주기 */
      .main-contents > div:nth-child(3) ~ div {
        /* 윗쪽마진 */
        margin-top: 20px;
      }

      /* 캐릭터이미지 셋팅 (비율박스) */
      .main-contents > div img {
        width: 300px;
        height: 300px;
        /* 원형 */
        border-radius: 50%;

        /* 트랜지션 trs ..> 박스한테 주면 에러 그래서 이미지에 효과주기*/
        transition: 0.6s;
      }
    

      /* 이미지가 겹치게 앱솔루트 셋팅 */
      #transform-box1 img {
        position: absolute;
        margin-left: 60px;
        width: 300px;
        height: 300px;
      } 
      /* 1.첫번째 img자식 - 유정이 원본(돌아올때) */
      #transform-box1 img:nth-of-type(2){
        /* 처음에 90도로 숨겨짐 */
        transform: rotateY(90deg);
        /* 트랜지션 trs : 바로출발, 처음만 천천히 ease-in */
        transition: 0.4s ease-in;
      }

      /* 2.첫번째 img자식 - 유정이 오버시 */
       #transform-box1:hover img:nth-of-type(2) {
        /* 처음에 90도로 숨겨짐 */     
        /* 트랜지션 trs : 
      보거미돌동안 0.4초 기다려 / 
      그대로 받아서 끝에 천천히 ease-out */
      border: thick double rgb(255, 66, 129);
        transform: rotateY(0deg);
        z-index: 1;
        /* 크기를 확대해 */
        scale: 2 2;

   /* 3. 처음에 0도로 보임 */
/* 마지막 img자식- 보검 원본(돌아올때)*/
        transition: 0.4s ease-out 0.4s;}
          #transform-box1 img:nth-of-type(1) {
        /* 처음에 0도로 보임 */
        transform: rotateY(0deg) ;
        /* 트랜지션 trs : 
      돌아올때 유정이 0.4초 기다려 / 
      그대로 받아서 끝에 천천히 ease-out */
        transition: 0.4s ease-out 0.4s;
      }

      /* 4.마지막째 img자식 - 보거미 오버시 */
       #transform-box1:hover img:nth-of-type(1) {
        /* 오버시 90도로 숨겨짐 */
        transform: rotateY(90deg);
        /* 트랜지션 trs : 바로출발, 처음만 천천히 ease-in */
        transition: 0.4s ease-in;
      }

        /**********************************************  
        CSS 필터 적용하기
      : 필터속성은 흑백,흐림,세피아,명암,
        채도 등 출력이미지를 변경하고자 할때
        사용하는 속성
        (참고)
        https://www.w3schools.com/cssref/playit.php?filename=playcss_filter&preval=blur(5px) */
      
  
      #transform-box2 img {
        /* 미리 x축 회전 해놓기 :tfrx */
        transform: rotateX(0deg);
        /* 필터블러 */
        filter: blur(0px);
      }
      /* 오버시 원상복귀 */
      #transform-box2:hover img {
        /* 미리 x축 회전 해놓기 :tfrx */
      transform: rotateX(180deg);
        /* 필터블러 */
        filter: blur(2px);
      }

      #transform-box3:hover img {
        /* x축이동 tftx */
        transform: translateX(-50%);
        /* -> % 단위 기준은 항상 자기자신의 크기다 */
      }

      #transform-box4:hover img {
        /* y축이동 tfty */
        transform: translateY(200%);
        /* -> %단위 기준은 항상 자기자신의 크기다!!! */
      }

    
      #transform-box5:hover img {
        /* x, y축이동 tft */
        /* transform: translate(-100%, -100%); */
        translate: 0 -100%;

        /* 투명도조정- opacity속성 */
        opacity: 0.5;
      }

  #transform-box6 img {
        position: absolute;
     
        width: 300px;
        height: 300px;}

      /* 이미지 회전축 변경하기 */
      #transform-box6 img:nth-of-type(1) {
          transform-origin: 20% 20%;
          transition:  1s ease-in  1.3s;
        
      }
      #transform-box6:hover img:nth-of-type(1) {
    opacity: 0;
        /* 트랜지션 시간늘리기 */
            transition:  1s ease-in 1s;
        transition-duration: 1s;
      }

   #transform-box6 img:nth-of-type(2) {
    opacity: 0;
    transition:  1s ease-out 1s;
        /* transform-origin: 20% 20%; */
      }
      #transform-box6:hover img:nth-of-type(2) {
        opacity: 1;
        /* 원형회전:tfr */
        /* transform: rotate(4587deg); */
        transform-origin: -20% -20%; 
        rotate: 4586deg;
        /* 트랜지션 시간늘리기 */
        transition-duration: 6s ease-out 1s;
      }

     /* 라벨디자인-버튼형 */
      .btn-action {
        /* 위 아래 마진 보더 등 적용위해 */
        display: block;
        width: 50px;
        height: 20px;
        text-align: center;
        margin-left: 50%;
         translate: -50% ;
        margin-top: 5px;
        padding: 10px;
        border: 1px solid rgb(255, 255, 255);
        border-radius: 10px;
        background-color: #ccc;
        /* 손가락모양 */
        cursor: pointer;
      }
      /* 가상요소로 버튼글씨 넣기 */
      .btn-action::before {
        content: "클릭";
      }
      /* 체크박스 체크시 버튼형 라벨 변경하기 */
      #chkbx:checked + .btn-action {
        background-color: rgb(255, 176, 242);
      }
      #chkbx:checked + .btn-action::before {
        content: "따딴";
      }
      /* 체크박스 숨기기 */
      #chkbx {
        display: none;
      }
 #chkbx:checked ~ .move-box #chi{
    /* 투명도 op- opacity:0~1사이값(0투명-반투명-1불투명) */
   left: 1300px;
    /* 트랜지션 trs : 3.9초 후 0.1초간 애니 */
    transition: 15s linear ;}

        #chi {
        position: absolute;
        left: 18%;
        top: 475px;
        width: 2%;}
 

    </style>
