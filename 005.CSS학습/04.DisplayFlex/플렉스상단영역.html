<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Flex 상단영역 3가지 예시</title>
    <style>
      
      .top-area {
        height: 125px;
      }

      .top-area .inbox{
         height: 125px;
        margin-bottom: 40px;
        background: #d04a4a;
        padding: 24px 0 24px 0;
        border-radius: 10px;
        box-shadow: 0 1px 12px rgba(0, 0, 0, 0.07);
      }

        .flex-bar {
        display: flex;
        align-items: center;
      
        border: 2px solid #eee;
        border-radius: 8px;
  
      }
      .box {
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 500;
        border: 2px solid #bbb;
    
   

      }
      .box1 {
        width: 72px;
       
      }
    
      .box3 {
       width: 64px;
      }

     h1{  font-size: 60px;
    }

    .logo{
      display: flex;
      flex-direction: column;
    }
    </style>
  </head>
  <body>
  <div id="top-area">
         <header class="top-area inbox">
 <div class="flex-bar">
        <div style="flex: 1; display: flex; justify-content: flex-start">
          <div class="box box1">Japanese Artist</div>
        </div>
        <div class="box logo">
          <h1>草間彌生</h1>
          <p>Official Website</p>
        
        </div>
        <div style="flex: 1; display: flex; justify-content: flex-end">
          <div class="box box3">Yayoi Kusama</div>
        </div>
      </div>
  </header>
    </div>
  </body>
</html>
